[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "routescout"
version = "1.0.0"
description = "Pre-routing PCB net observed-cost ranking and router-order intervention"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
]

[project.optional-dependencies]
ml = [
  "matplotlib>=3.8",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "catboost>=1.2",
]
dev = [
  "pytest>=8",
  "nbformat>=5.10",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  # Byte-locked scientific runners: guarded by SHA-256 + syntax tests instead.
  "src/routescout/phase8a_runner.py",
  "src/routescout/phase8b_runner.py",
]

[tool.ruff.lint]
# Focus CI on correctness/readability. Security/provenance checks are handled
# explicitly by scripts/static_check.py, which avoids subprocess/test false positives.
select = ["E", "F", "B", "BLE", "C4", "SIM", "RUF", "PLW"]
